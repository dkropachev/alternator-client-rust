name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only, or publish a release
        required: true
        default: validate
        type: choice
        options:
          - validate
          - release
      version:
        description: Final package version (X.Y.Z)
        required: true
        type: string
      target_commit:
        description: Exact lowercase 40-character commit SHA from main
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PACKAGE_NAME: alternator-client
  RELEASE_MODE: ${{ inputs.mode }}
  RELEASE_VERSION: ${{ inputs.version }}
  TARGET_COMMIT: ${{ inputs.target_commit }}
  RUST_VERSION: 1.94.1
  RUSTDOC_TOOLCHAIN: nightly-2026-06-23
  CCM_COMMIT: f9e8f8c221f76251318c61ba8a0ce6acec860f6d
  CARGO_CYCLONEDX_VERSION: 0.5.9
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_DENY_VERSION: 0.20.2
  CARGO_SEMVER_CHECKS_VERSION: 0.50.0

jobs:
  preflight:
    name: Preflight and plan candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
      candidate_id: ${{ steps.candidate.outputs.candidate_id }}
      rc_tag: ${{ steps.rc_plan.outputs.rc_tag }}
      rc_action: ${{ steps.rc_plan.outputs.action }}
      portable_matrix: ${{ steps.policy.outputs.portable_matrix }}
      scylla_matrix: ${{ steps.policy.outputs.scylla_matrix }}
    steps:
      - name: Authorize the dispatch identity before checkout
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'target_commit must be a lowercase 40-character SHA' >&2
            exit 1
          }
          test "$DISPATCH_REF" = refs/heads/main || {
            echo 'release workflow must be dispatched from main' >&2
            exit 1
          }
          test "$TARGET_COMMIT" = "$DISPATCH_SHA" || {
            echo "target_commit $TARGET_COMMIT does not match dispatch SHA $DISPATCH_SHA" >&2
            exit 1
          }
      - name: Check out the explicit target commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the checked-out identity before repository code
        run: |
          head_commit=$(git rev-parse HEAD)
          test "$head_commit" = "$TARGET_COMMIT" || {
            echo "checkout HEAD $head_commit does not match target_commit $TARGET_COMMIT" >&2
            exit 1
          }
      - name: Check for release blockers
        if: ${{ inputs.mode == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/check-release-blockers.sh
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
      - name: Load reviewed release policy
        id: policy
        run: |
          echo "portable_matrix=$(bash scripts/release/release-policy.sh portable-matrix)" >>"$GITHUB_OUTPUT"
          echo "scylla_matrix=$(bash scripts/release/release-policy.sh scylla-matrix)" >>"$GITHUB_OUTPUT"
      - name: Validate release inputs
        run: >-
          bash scripts/release/preflight.sh
          "$RELEASE_MODE"
          "$RELEASE_VERSION"
          "$TARGET_COMMIT"
      - name: Record immutable commit
        id: identity
        run: echo "commit_sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - name: Plan this run's RC tag without mutating the repository
        if: ${{ inputs.mode == 'release' }}
        id: rc_plan
        run: >-
          bash scripts/release/plan-rc.sh
          "$RELEASE_VERSION"
          '${{ steps.identity.outputs.commit_sha }}'
      - name: Set stable candidate identity
        id: candidate
        env:
          PLANNED_RC_TAG: ${{ steps.rc_plan.outputs.rc_tag }}
        run: |
          if [[ "$RELEASE_MODE" == release ]]; then
            test -n "$PLANNED_RC_TAG"
            candidate_id=$PLANNED_RC_TAG
          else
            candidate_id="validation-$GITHUB_RUN_ID"
          fi
          echo "candidate_id=$candidate_id" >>"$GITHUB_OUTPUT"
      - name: Audit release-tag rules
        if: ${{ inputs.mode == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
        run: bash scripts/release/check-release-tag-rulesets.sh

  allocate_rc:
    name: Allocate or recover immutable RC
    if: ${{ inputs.mode == 'release' }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out immutable target commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate the read-only RC plan
        id: rc_plan
        env:
          EXPECTED_ACTION: ${{ needs.preflight.outputs.rc_action }}
          EXPECTED_RC_TAG: ${{ needs.preflight.outputs.rc_tag }}
        run: |
          plan_output=$(mktemp)
          GITHUB_OUTPUT="$plan_output" bash scripts/release/plan-rc.sh \
            "$RELEASE_VERSION" '${{ needs.preflight.outputs.commit_sha }}' >/dev/null
          rc_tag=$(awk -F= '$1 == "rc_tag" { print $2 }' "$plan_output")
          action=$(awk -F= '$1 == "action" { print $2 }' "$plan_output")
          test "$rc_tag" = "$EXPECTED_RC_TAG"
          if [[ "$action" != "$EXPECTED_ACTION" ]]; then
            test "$EXPECTED_ACTION" = create
            test "$action" = recover
          fi
          cat "$plan_output" >>"$GITHUB_OUTPUT"
      - name: Mint repository-only release App token
        if: ${{ steps.rc_plan.outputs.action == 'create' }}
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.ALTERNATOR_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Resolve release App tag identity
        if: ${{ steps.rc_plan.outputs.action == 'create' }}
        id: app_identity
        env:
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$APP_SLUG" = scylladb-alternator-client-release
          bot_id=$(gh api "/users/$APP_SLUG[bot]" --jq .id)
          [[ "$bot_id" =~ ^[1-9][0-9]*$ ]]
          echo "bot_id=$bot_id" >>"$GITHUB_OUTPUT"
      - name: Allocate or recover the planned RC tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP_BOT_ID: ${{ steps.app_identity.outputs.bot_id }}
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          RELEASE_APP_TOKEN: ${{ steps.app_token.outputs.token }}
        run: >-
          bash scripts/release/allocate-rc.sh
          "$RELEASE_VERSION"
          '${{ needs.preflight.outputs.commit_sha }}'
          '${{ steps.rc_plan.outputs.rc_tag }}'
          '${{ steps.rc_plan.outputs.action }}'

  package:
    name: Package candidate
    if: >-
      ${{ always() && needs.preflight.result == 'success' &&
          ((inputs.mode == 'validate' && needs.allocate_rc.result == 'skipped') ||
           (inputs.mode == 'release' && needs.allocate_rc.result == 'success')) }}
    needs: [preflight, allocate_rc]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      crate_sha256: ${{ steps.package.outputs.crate_sha256 }}
    steps:
      - name: Check out immutable RC commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup toolchain install "$RUSTDOC_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
      - name: Install pinned SBOM generator
        run: cargo install cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION" --locked
      - name: Create candidate before any test runs
        id: package
        run: |
          mkdir '${{ runner.temp }}/candidate'
          bash scripts/release/package-candidate.sh \
            "$RELEASE_MODE" \
            "$RELEASE_VERSION" \
            '${{ needs.preflight.outputs.candidate_id }}' \
            '${{ needs.preflight.outputs.commit_sha }}' \
            '${{ runner.temp }}/candidate'
      - name: Name this attempt's candidate artifact
        id: artifact
        run: echo "name=alternator-client-${{ needs.preflight.outputs.candidate_id }}-attempt-${{ github.run_attempt }}" >>"$GITHUB_OUTPUT"
      - name: Require deterministic regeneration on rerun
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/release/compare-previous-candidate.sh
          '${{ runner.temp }}/candidate'
          '${{ steps.artifact.outputs.name }}'
          'alternator-client-${{ needs.preflight.outputs.candidate_id }}-attempt-'
      - name: Upload immutable candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  attest_candidate:
    name: Attest candidate provenance
    if: ${{ inputs.mode == 'release' }}
    needs: [preflight, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download packaged candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate
      - name: Attest candidate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/candidate/*
      - name: Attest candidate SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/candidate/alternator-client-${{ env.RELEASE_VERSION }}.crate
          predicate-type: https://cyclonedx.org/bom
          predicate-path: ${{ runner.temp }}/candidate/alternator-client-${{ env.RELEASE_VERSION }}.cdx.json

  attestation_gate:
    name: Attestation mode gate
    if: ${{ always() }}
    needs: [package, attest_candidate]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require or permit provenance according to mode
        env:
          ATTESTATION_RESULT: ${{ needs.attest_candidate.result }}
          MODE: ${{ inputs.mode }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$PACKAGE_RESULT" = success
          if [[ "$MODE" == release ]]; then
            test "$ATTESTATION_RESULT" = success
          else
            test "$MODE" = validate
            test "$ATTESTATION_RESULT" = skipped
          fi

  portable:
    name: Portable (${{ matrix.target }})
    needs: [preflight, package, attestation_gate]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.portable_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out candidate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          persist-credentials: false
      - name: Download exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate
      - name: Verify and extract candidate
        id: candidate
        run: >-
          bash scripts/release/verify-candidate.sh
          '${{ runner.temp }}/candidate'
          '${{ runner.temp }}/extract'
          "$RELEASE_MODE"
          "$RELEASE_VERSION"
          '${{ needs.preflight.outputs.candidate_id }}'
          '${{ needs.preflight.outputs.commit_sha }}'
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup toolchain install "$RUSTDOC_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
      - name: Assert native host
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = '${{ matrix.target }}'
      - name: Test extracted candidate
        working-directory: ${{ steps.candidate.outputs.package_dir }}
        env:
          EXPECTED_RUST_HOST: ${{ matrix.target }}
        run: CARGO='cargo --locked' make test-portable

  static_candidate:
    name: Static checks (candidate)
    needs: [preflight, package, attestation_gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out candidate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          persist-credentials: false
      - name: Download exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate
      - name: Verify and extract candidate
        id: candidate
        run: >-
          bash scripts/release/verify-candidate.sh
          '${{ runner.temp }}/candidate'
          '${{ runner.temp }}/extract'
          "$RELEASE_MODE"
          "$RELEASE_VERSION"
          '${{ needs.preflight.outputs.candidate_id }}'
          '${{ needs.preflight.outputs.commit_sha }}'
      - name: Install pinned Rust with lint components
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy --no-self-update
          rustup default "$RUST_VERSION"
      - name: Run shared static checks on extracted candidate
        working-directory: ${{ steps.candidate.outputs.package_dir }}
        run: CARGO='cargo --locked' make static-checks

  security_candidate:
    name: Dependency security and policy (candidate)
    needs: [preflight, package, attestation_gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out candidate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          persist-credentials: false
      - name: Download exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate
      - name: Verify and extract candidate
        id: candidate
        run: >-
          bash scripts/release/verify-candidate.sh
          '${{ runner.temp }}/candidate'
          '${{ runner.temp }}/extract'
          "$RELEASE_MODE"
          "$RELEASE_VERSION"
          '${{ needs.preflight.outputs.candidate_id }}'
          '${{ needs.preflight.outputs.commit_sha }}'
      - name: Install pinned Rust and security tools
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
          cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
      - name: Audit extracted candidate
        working-directory: ${{ steps.candidate.outputs.package_dir }}
        run: make security-checks

  packaging_candidate:
    name: Publication and compatibility (candidate)
    needs: [preflight, package, attestation_gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out candidate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          persist-credentials: false
      - name: Download exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate
      - name: Verify and extract candidate
        id: candidate
        run: >-
          bash scripts/release/verify-candidate.sh
          '${{ runner.temp }}/candidate'
          '${{ runner.temp }}/extract'
          "$RELEASE_MODE"
          "$RELEASE_VERSION"
          '${{ needs.preflight.outputs.candidate_id }}'
          '${{ needs.preflight.outputs.commit_sha }}'
      - name: Install pinned Rust and compatibility tool
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          cargo install cargo-semver-checks --version "$CARGO_SEMVER_CHECKS_VERSION" --locked
      - name: Inspect exact package contents
        working-directory: ${{ steps.candidate.outputs.package_dir }}
        env:
          CANDIDATE_CRATE: ${{ runner.temp }}/candidate/alternator-client-${{ env.RELEASE_VERSION }}.crate
        run: bash scripts/release/inspect-package.sh "$RELEASE_VERSION" "$CANDIDATE_CRATE"
      - name: Prepare extracted source for Cargo publication validation
        working-directory: ${{ steps.candidate.outputs.package_dir }}
        run: |
          mv Cargo.toml.orig Cargo.toml
          rm -f .cargo_vcs_info.json
      - name: Run publication dry-run and SemVer check
        working-directory: ${{ steps.candidate.outputs.package_dir }}
        run: |
          CARGO='cargo --locked' make package-dry-run
          make semver-check

  scylla:
    name: Scylla (${{ matrix.arch }}, ${{ matrix.scylla }})
    needs: [preflight, package, attestation_gate]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.scylla_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out candidate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          persist-credentials: false
      - name: Download exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate
      - name: Verify and extract candidate
        id: candidate
        run: >-
          bash scripts/release/verify-candidate.sh
          '${{ runner.temp }}/candidate'
          '${{ runner.temp }}/extract'
          "$RELEASE_MODE"
          "$RELEASE_VERSION"
          '${{ needs.preflight.outputs.candidate_id }}'
          '${{ needs.preflight.outputs.commit_sha }}'
      - name: Install pinned Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
      - name: Assert native host
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = '${{ matrix.target }}'
      - name: Install pinned scylla-ccm
        run: |
          python3 -m venv "$RUNNER_TEMP/ccm-venv"
          "$RUNNER_TEMP/ccm-venv/bin/pip" install \
            "https://github.com/scylladb/scylla-ccm/archive/$CCM_COMMIT.zip"
          echo "$RUNNER_TEMP/ccm-venv/bin" >>"$GITHUB_PATH"
      - name: Run complete Scylla suite on extracted candidate
        working-directory: ${{ steps.candidate.outputs.package_dir }}
        env:
          CCM_SCYLLA_VERSION: release:${{ matrix.scylla }}
          SCYLLA_ARCH: ${{ matrix.arch }}
          ALTERNATOR_HTTP_COMPRESSION: ${{ matrix.alternator_http_compression }}
        run: |
          CARGO='cargo --locked' make test-server \
            SCYLLA_ALTERNATOR_HTTP_COMPRESSION="$ALTERNATOR_HTTP_COMPRESSION"
          CARGO='cargo --locked' make test-ccm

  portable_gate:
    name: Portable gate
    if: ${{ always() }}
    needs: portable
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every portable matrix cell
        env:
          RESULT: ${{ needs.portable.result }}
        run: test "$RESULT" = success

  static_release_gate:
    name: Static, security, and packaging gate
    if: ${{ always() }}
    needs: [static_candidate, security_candidate, packaging_candidate]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every release check
        env:
          STATIC_RESULT: ${{ needs.static_candidate.result }}
          SECURITY_RESULT: ${{ needs.security_candidate.result }}
          PACKAGING_RESULT: ${{ needs.packaging_candidate.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$SECURITY_RESULT" = success
          test "$PACKAGING_RESULT" = success

  scylla_gate:
    name: Scylla gate
    if: ${{ always() }}
    needs: scylla
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every Scylla matrix cell
        env:
          RESULT: ${{ needs.scylla.result }}
        run: test "$RESULT" = success

  evidence:
    name: Preserve test evidence
    if: ${{ always() && needs.package.result == 'success' }}
    needs: [preflight, package, attest_candidate, attestation_gate, portable_gate, static_release_gate, scylla_gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
    steps:
      - name: Check out evidence generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          persist-credentials: false
      - name: Create immutable evidence record
        env:
          ATTESTATION_RESULT: ${{ needs.attest_candidate.result }}
          GH_TOKEN: ${{ github.token }}
          PORTABLE_RESULT: ${{ needs.portable_gate.result }}
          STATIC_RESULT: ${{ needs.static_release_gate.result }}
          SCYLLA_RESULT: ${{ needs.scylla_gate.result }}
        run: >-
          bash scripts/release/create-evidence.sh
          "$RELEASE_MODE"
          "$RELEASE_VERSION"
          '${{ needs.preflight.outputs.candidate_id }}'
          '${{ needs.preflight.outputs.commit_sha }}'
          '${{ needs.package.outputs.crate_sha256 }}'
          test-evidence.json
      - name: Name evidence artifact
        id: identity
        run: echo "artifact_name=release-evidence-${{ needs.preflight.outputs.candidate_id }}-attempt-${{ github.run_attempt }}" >>"$GITHUB_OUTPUT"
      - name: Upload test evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: test-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Mark failed evidence for rerun
        env:
          ATTESTATION_RESULT: ${{ needs.attest_candidate.result }}
          PORTABLE_RESULT: ${{ needs.portable_gate.result }}
          STATIC_RESULT: ${{ needs.static_release_gate.result }}
          SCYLLA_RESULT: ${{ needs.scylla_gate.result }}
        run: |
          if [[ "$RELEASE_MODE" == release ]]; then
            test "$ATTESTATION_RESULT" = success
          else
            test "$RELEASE_MODE" = validate
            test "$ATTESTATION_RESULT" = skipped
          fi
          test "$PORTABLE_RESULT" = success
          test "$STATIC_RESULT" = success
          test "$SCYLLA_RESULT" = success

  final_gate:
    name: Final validation and release gate
    if: ${{ always() }}
    needs: [preflight, package, attest_candidate, attestation_gate, portable_gate, static_release_gate, scylla_gate, evidence]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Summarize and require all candidate gates
        env:
          ATTESTATION_GATE_RESULT: ${{ needs.attestation_gate.result }}
          ATTESTATION_RESULT: ${{ needs.attest_candidate.result }}
          CANDIDATE_ID: ${{ needs.preflight.outputs.candidate_id }}
          CRATE_SHA256: ${{ needs.package.outputs.crate_sha256 }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          PORTABLE_RESULT: ${{ needs.portable_gate.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SCYLLA_RESULT: ${{ needs.scylla_gate.result }}
          STATIC_RESULT: ${{ needs.static_release_gate.result }}
        run: |
          current_main=not-checked
          main_result=not-required
          if [[ "$RELEASE_MODE" == validate ]]; then
            if current_main=$(gh api \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha) && \
              [[ "$current_main" =~ ^[0-9a-f]{40}$ ]] && \
              [[ "$current_main" == "$TARGET_COMMIT" ]]; then
              main_result=success
            else
              main_result=failure
            fi
          fi

          {
            echo '## Candidate gate summary'
            echo
            echo "- Mode: \`$RELEASE_MODE\`"
            echo "- Candidate: \`$CANDIDATE_ID\`"
            echo "- Target commit: \`$TARGET_COMMIT\`"
            echo "- Candidate SHA-256: \`$CRATE_SHA256\`"
            echo "- Current \`origin/main\`: \`$current_main\`"
            echo
            echo '| Gate | Result |'
            echo '| --- | --- |'
            echo "| Preflight | $PREFLIGHT_RESULT |"
            echo "| Package | $PACKAGE_RESULT |"
            echo "| Provenance attestation | $ATTESTATION_RESULT |"
            echo "| Attestation mode contract | $ATTESTATION_GATE_RESULT |"
            echo "| Portable | $PORTABLE_RESULT |"
            echo "| Static, security, and packaging | $STATIC_RESULT |"
            echo "| Scylla | $SCYLLA_RESULT |"
            echo "| Evidence | $EVIDENCE_RESULT |"
            echo "| Validation target still current | $main_result |"
          } >>"$GITHUB_STEP_SUMMARY"

          test "$PREFLIGHT_RESULT" = success
          test "$PACKAGE_RESULT" = success
          if [[ "$RELEASE_MODE" == release ]]; then
            test "$ATTESTATION_RESULT" = success
          else
            test "$RELEASE_MODE" = validate
            test "$ATTESTATION_RESULT" = skipped
            test "$main_result" = success
          fi
          test "$ATTESTATION_GATE_RESULT" = success
          test "$PORTABLE_RESULT" = success
          test "$STATIC_RESULT" = success
          test "$SCYLLA_RESULT" = success
          test "$EVIDENCE_RESULT" = success
          [[ "$CRATE_SHA256" =~ ^[0-9a-f]{64}$ ]]

  publish:
    name: Publish and verify crates.io bytes
    if: ${{ inputs.mode == 'release' }}
    needs: [preflight, package, final_gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
      issues: read
    outputs:
      registry_sha256: ${{ steps.registry.outputs.registry_sha256 || steps.publish.outputs.registry_sha256 }}
    steps:
      - name: Check out immutable RC commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download tested candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate
      - name: Verify candidate identity
        run: >-
          bash scripts/release/verify-candidate.sh
          '${{ runner.temp }}/candidate'
          '${{ runner.temp }}/extract'
          release
          "$RELEASE_VERSION"
          '${{ needs.preflight.outputs.candidate_id }}'
          '${{ needs.preflight.outputs.commit_sha }}'
      - name: Install pinned Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
      - name: Repackage immutable RC and compare bytes
        run: >-
          bash scripts/release/repackage-and-compare.sh
          "$RELEASE_VERSION"
          '${{ needs.preflight.outputs.commit_sha }}'
          '${{ runner.temp }}/candidate/alternator-client-${{ env.RELEASE_VERSION }}.crate'
      - name: Query registry idempotently
        id: registry
        run: >-
          bash scripts/release/registry-state.sh
          alternator-client
          "$RELEASE_VERSION"
          '${{ runner.temp }}/candidate/alternator-client-${{ env.RELEASE_VERSION }}.crate'
      - name: Refuse to publish a superseded RC
        if: ${{ steps.registry.outputs.state == 'absent' }}
        run: >-
          bash scripts/release/assert-latest-rc.sh
          "$RELEASE_VERSION"
          '${{ needs.preflight.outputs.rc_tag }}'
          '${{ needs.preflight.outputs.commit_sha }}'
      - name: Obtain short-lived crates.io credential
        if: ${{ steps.registry.outputs.state == 'absent' }}
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish and verify registry bytes
        if: ${{ steps.registry.outputs.state == 'absent' }}
        id: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/release/publish-and-verify.sh
          release
          '${{ github.workspace }}'
          "$RELEASE_VERSION"
          '${{ needs.preflight.outputs.candidate_id }}'
          '${{ needs.preflight.outputs.commit_sha }}'
          '${{ runner.temp }}/candidate'
      - name: Confirm recovered publication
        if: ${{ steps.registry.outputs.state == 'exact' }}
        run: echo 'crates.io already serves the exact tested candidate; resuming finalization.'

  finalize:
    name: Create immutable GitHub Release
    if: ${{ inputs.mode == 'release' }}
    needs: [preflight, package, evidence, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out immutable RC commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download tested candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate
      - name: Download test evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.evidence.outputs.artifact_name }}
          path: ${{ runner.temp }}/evidence
      - name: Mint repository-only release App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.ALTERNATOR_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Resolve release App tag identity
        id: app_identity
        env:
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$APP_SLUG" = scylladb-alternator-client-release
          bot_id=$(gh api "/users/$APP_SLUG[bot]" --jq .id)
          [[ "$bot_id" =~ ^[1-9][0-9]*$ ]]
          echo "bot_id=$bot_id" >>"$GITHUB_OUTPUT"
      - name: Finalize only after registry byte verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP_BOT_ID: ${{ steps.app_identity.outputs.bot_id }}
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          RELEASE_APP_TOKEN: ${{ steps.app_token.outputs.token }}
        run: >-
          bash scripts/release/finalize-release.sh
          release
          "$RELEASE_VERSION"
          '${{ needs.preflight.outputs.candidate_id }}'
          '${{ needs.preflight.outputs.commit_sha }}'
          '${{ runner.temp }}/candidate'
          '${{ runner.temp }}/evidence/test-evidence.json'
